service: pixel_gallery
framework: nestjs
authorization_style: guards (@UseGuards/@Roles)
partition: train_only
oas_status: script_projection
group_semantics: membership_required = (caller_id, record.group_id) in memberships
  (v3.0 meaning)
endpoints:
- id: pixel_gallery_catalogue_0
  method: GET
  path: /fixtures/pixel_gallery/artworks/catalogue/current/{item_id}
  label: public
  vulnerable: false
  reason: Intentionally anonymous reference catalogue.
- id: pixel_gallery_catalogue_1
  method: GET
  path: /fixtures/pixel_gallery/artworks/catalogue/archive/{item_id}
  label: public
  vulnerable: false
  reason: Intentionally anonymous reference catalogue.
