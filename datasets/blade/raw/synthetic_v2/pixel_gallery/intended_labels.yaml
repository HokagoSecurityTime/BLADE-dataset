  label: owner_match
  vulnerable: false
  reason: Only the record owner may read it.
- id: pixel_gallery_drafts_1
  method: GET
  path: /fixtures/pixel_gallery/artworks/drafts/archive/{item_id}
  label: owner_match
  vulnerable: true
  reason: Only the record owner may read it.
